<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cesium Client Demo</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.130/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet"
        href="https://cesium.com/downloads/cesiumjs/releases/1.130/Build/Cesium/Widgets/widgets.css">
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <script>
    const viewer = new Cesium.Viewer("cesiumContainer");

    // Replace this with the online URL to your tileset.json
    Cesium.Cesium3DTileset.fromUrl("https://YOUR-HOST/demo/tileset.json")
      .then(tileset => viewer.scene.primitives.add(tileset))
      .catch(error => console.error("Could not load tileset:", error));
  </script>
</body>
</html>
